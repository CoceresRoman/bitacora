name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The scheduler's cadence (Mon/Wed/Fri 08:00) is computed in local time;
      # match the timezone of the machine this runs on so recovery-window
      # tests agree with production.
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
        env: { DATABASE_URL: "file:./data/ci.db" }
      - run: npm run lint
      - run: npm test
